[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "realclip-moa"
version = "0.1.0"
description = "Existing RealCLIP multilabel MoA prediction and evaluation helpers"
requires-python = ">=3.12,<3.13"
dependencies = [
  "numpy==2.5.4",
  "scikit-learn==1.9.1",
  "joblib==1.6.0",
  "threadpoolctl==3.7.0",
  "pandas==3.0.6",
  "pyarrow==24.0.0",
  "matplotlib==3.11.2",
]

[project.optional-dependencies]
dev = ["pytest==9.1.1"]
encoders = ["torch==2.13.0", "torchvision==0.28.0", "transformers==4.57.6", "open-clip-torch==3.3.0", "timm==1.0.30", "pillow==12.3.0", "huggingface-hub==0.36.2", "safetensors==0.8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/wellclip"]

[tool.pytest.ini_options]
testpaths = ["tests"]
